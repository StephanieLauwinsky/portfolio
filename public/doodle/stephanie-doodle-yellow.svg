  <path d="M120 38 C 119 50, 119 62, 120 72" stroke="#ffe500" stroke-width="2.5"/>
  <!-- wave strands, only near the ends -->
  <path d="M48 186 C 54 196, 46 206, 52 216" stroke="#ffe500" stroke-width="2"/>
  <path d="M192 186 C 186 196, 194 206, 188 216" stroke="#ffe500" stroke-width="2"/>
  <!-- brows: thin, straight -->
  <path d="M82 104 L 106 102" stroke-width="3"/>
  <path d="M134 102 L 158 104" stroke-width="3"/>
  <!-- eyes: large, glancing to the side -->
  <path d="M82 130 C 88 121, 102 121, 108 130" stroke-width="3.5"/>
  <path d="M132 130 C 138 121, 152 121, 158 130" stroke-width="3.5"/>
  <circle cx="91" cy="131" r="7" fill="#111" stroke="none"/>
  <circle cx="141" cy="131" r="7" fill="#111" stroke="none"/>
  <circle cx="89" cy="128.5" r="2" fill="#fff" stroke="none"/>
  <circle cx="139" cy="128.5" r="2" fill="#fff" stroke="none"/>
  <!-- big round glasses, thin brown frames -->
  <circle cx="95" cy="130" r="25" stroke="#7a4632" stroke-width="2.6"/>
  <circle cx="145" cy="130" r="25" stroke="#7a4632" stroke-width="2.6"/>
  <path d="M117 124 C 119 120, 121 120, 123 124" stroke="#7a4632" stroke-width="2.6"/>
  <path d="M70 126 L 64 122 M170 126 L 176 122" stroke="#7a4632" stroke-width="2.6"/>
  <!-- nose -->
  <path d="M120 146 C 119 154, 117 158, 122 160" stroke-width="3"/>
  <!-- blush -->
  <ellipse cx="80" cy="162" rx="9" ry="5" fill="#f4a3a0" fill-opacity="0.55" stroke="none"/>
  <ellipse cx="160" cy="162" rx="9" ry="5" fill="#f4a3a0" fill-opacity="0.55" stroke="none"/>
  <!-- smile: closed-mouth, full soft-pink lips curving up at the corners -->
  <path d="M103 170 C 109 174, 114 173, 120 175 C 126 173, 131 174, 137 170 C 132 187, 108 187, 103 170 Z" fill="#ec9a94" stroke-width="2.5"/>
  <path d="M103 170 C 112 179, 128 179, 137 170" stroke-width="2.5"/>
  <path d="M101 167 C 102 169, 102 171, 104 172 M139 167 C 138 169, 138 171, 136 172" stroke-width="2"/>
